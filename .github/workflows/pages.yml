name: Publish download site
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build_site.py', 'scripts/download_count.py', '.github/workflows/pages.yml']
  schedule:
    - cron: '23 * * * *' # refresh the download count
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_site.py
      - run: python3 scripts/download_count.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
