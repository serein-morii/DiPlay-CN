name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Publish failure diagnostics
        if: failure()
        run: |
          set -uo pipefail
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace > gradle.log 2>&1 || true
          {
            date
            echo '--- compile/lint errors ---'
            grep -nE "^e: |error: |Error:|FAILURE: |What went wrong" -A 4 gradle.log | head -200
            echo '--- log tail ---'
            tail -80 gradle.log
            echo '--- failed tests ---'
            grep -rn --include='TEST-*.xml' -B8 '<failure' . | grep -E 'testcase name|<failure' | head -60 || true
            grep -rn --include='TEST-*.xml' -o '<error message="[^"]*"' . | head -20 || true
          } > failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "ci/diagnostics-${{ github.run_id }}"
          git add failure.txt
          git commit -m "diagnostics ${{ github.run_id }}"
          git push origin "HEAD:ci/diagnostics-${{ github.run_id }}"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
